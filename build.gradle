plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

base.archivesName = project.archives_base_name
version = project.mod_version
group = project.maven_group
def expandedModVersion = version
def licenseArchiveName = project.archives_base_name
def dripstoneTest = providers.gradleProperty('dripstoneTest').isPresent()
def cropTest = providers.gradleProperty('cropTest').isPresent()
def sensorTest = providers.gradleProperty('sensorTest').isPresent()
def iceTest = providers.gradleProperty('iceTest').isPresent()
def valveTest = providers.gradleProperty('valveTest').isPresent()
def generatorTest = providers.gradleProperty('generatorTest').isPresent()
def pumpTest = providers.gradleProperty('pumpTest').isPresent()
def fireTest = providers.gradleProperty('fireTest').isPresent()
if (dripstoneTest || cropTest || sensorTest || iceTest || pumpTest || valveTest || generatorTest || fireTest) {
	sourceSets.main.java.srcDir 'src/serverTest/java'
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = 'CurseForge'
				url = 'https://www.cursemaven.com'
			}
		}
		filter {
			includeGroup 'curse.maven'
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	runs {
		if (dripstoneTest || cropTest || sensorTest || iceTest || pumpTest || valveTest || generatorTest || fireTest) {
			server {
				runDir fireTest ? 'build/fire-test-server' : generatorTest ? 'build/generator-test-server' : valveTest ? 'build/valve-test-server' : pumpTest ? 'build/pump-test-server' : iceTest ? 'build/ice-test-server' : sensorTest ? 'build/sensor-test-server' : cropTest ? 'build/crop-test-server' : 'build/dripstone-test-server'
			}
		}
		client {
			ideConfigGenerated false
		}
	}

	mods {
		"immersivefluids" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "curse.maven:framework-549225:${project.framework_file_id}"
	testRuntimeOnly "com.electronwill.night-config:core:3.8.3"

	//modImplementation "carpet:fabric-carpet:${project.minecraft_version}-${project.carpet_core_version}"
}

processResources {
	inputs.property "version", expandedModVersion
	inputs.property "dripstoneTest", dripstoneTest
	inputs.property "cropTest", cropTest
	inputs.property "sensorTest", sensorTest
	inputs.property "iceTest", iceTest
	inputs.property "pumpTest", pumpTest
	inputs.property "valveTest", valveTest
	inputs.property "generatorTest", generatorTest
	inputs.property "fireTest", fireTest

	filesMatching("fabric.mod.json") {
		expand "version": expandedModVersion
        if (valveTest) {
            filter { line -> line.replace('"io.github.SirWashington.WaterPhysics"',
                    '"io.github.SirWashington.WaterPhysics", "io.github.SirWashington.features.WaterValveServerTest"') }
        }
		if (generatorTest) {
			filter { line -> line.replace('"io.github.SirWashington.WaterPhysics"',
					'"io.github.SirWashington.WaterPhysics", "io.github.SirWashington.features.DihydrogenMonoxideAssemblerServerTest"') }
		}
		if (fireTest) {
			filter { line -> line.replace('"io.github.SirWashington.WaterPhysics"',
					'"io.github.SirWashington.WaterPhysics", "io.github.SirWashington.features.FiniteWaterFireServerTest"') }
		}
		if (pumpTest) {
			filter { line -> line.replace('"io.github.SirWashington.WaterPhysics"',
					'"io.github.SirWashington.WaterPhysics", "io.github.SirWashington.features.WaterPumpServerTest"') }
		}
		if (iceTest) {
			filter { line -> line.replace('"io.github.SirWashington.WaterPhysics"',
					'"io.github.SirWashington.WaterPhysics", "io.github.SirWashington.features.FiniteIceServerTest"') }
		}
		if (dripstoneTest) {
			filter { line -> line.replace('"io.github.SirWashington.WaterPhysics"',
					'"io.github.SirWashington.WaterPhysics", "io.github.SirWashington.features.DripstoneServerTest"') }
		}
		if (cropTest) {
			filter { line -> line.replace('"io.github.SirWashington.WaterPhysics"',
					'"io.github.SirWashington.WaterPhysics", "io.github.SirWashington.features.CropFertilizationServerTest"') }
		}
		if (sensorTest) {
			filter { line -> line.replace('"io.github.SirWashington.WaterPhysics"',
					'"io.github.SirWashington.WaterPhysics", "io.github.SirWashington.features.RainSensorServerTest"') }
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

tasks.register("physicsSelfTest", JavaExec) {
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "io.github.SirWashington.features.FiniteWaterMathSelfTest"
}

test {
	failOnNoDiscoveredTests = false
}

sourceSets {
	clientTest {
		compileClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.compileClasspath
		runtimeClasspath += sourceSets.main.output + sourceSets.client.runtimeClasspath
	}
}

tasks.register('iceRenderSelfTest', JavaExec) {
	dependsOn clientTestClasses
	classpath = sourceSets.clientTest.runtimeClasspath
	mainClass = 'io.github.SirWashington.IceRenderSelfTest'
}

check.dependsOn physicsSelfTest, iceRenderSelfTest

tasks.register('pumpGeometrySelfTest', JavaExec) {
	dependsOn clientTestClasses
	classpath = sourceSets.clientTest.runtimeClasspath
	mainClass = 'io.github.SirWashington.PumpGeometrySelfTest'
}
check.dependsOn pumpGeometrySelfTest

if (pumpTest) {
	tasks.named('runServer') {
		doLast {
			if (!file('build/pump-test-server/logs/latest.log').text.contains('WATER_PUMP_SERVER_TEST_PASS')) {
				throw new GradleException('Pump regression failed; inspect build/pump-test-server/logs/latest.log')
			}
		}
	}
}

if (iceTest) {
	tasks.named('runServer') {
		doLast {
			if (!file('build/ice-test-server/logs/latest.log').text.contains('FINITE_ICE_SERVER_TEST_PASS')) {
				throw new GradleException('Finite ice regression failed; inspect build/ice-test-server/logs/latest.log')
			}
		}
	}
}

if (sensorTest) {
	tasks.named('runServer') {
		doLast {
			if (!file('build/sensor-test-server/logs/latest.log').text.contains('RAIN_SENSOR_SERVER_TEST_PASS')) {
				throw new GradleException('Sensor/grate regression failed; inspect build/sensor-test-server/logs/latest.log')
			}
		}
	}
}

if (cropTest) {
	tasks.named('runServer') {
		doLast {
			if (!file('build/crop-test-server/logs/latest.log').text.contains('CROP_FERTILIZATION_SERVER_TEST_PASS')) {
				throw new GradleException('Crop fertilization regression failed; inspect build/crop-test-server/logs/latest.log')
			}
		}
	}
}

if (dripstoneTest) {
	tasks.named('runServer') {
		doLast {
			if (!file('build/dripstone-test-server/logs/latest.log').text.contains('DRIPSTONE_SERVER_TEST_PASS')) {
				throw new GradleException('Dripstone server regression failed; inspect build/dripstone-test-server/logs/latest.log')
			}
		}
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${licenseArchiveName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

tasks.register('valveGeometrySelfTest', JavaExec) {
    dependsOn clientTestClasses
    classpath = sourceSets.clientTest.runtimeClasspath
    mainClass = 'io.github.SirWashington.ValveGeometrySelfTest'
}
check.dependsOn valveGeometrySelfTest

if (valveTest) {
    tasks.named('runServer') {
        doLast {
            if (!file('build/valve-test-server/logs/latest.log').text.contains('WATER_VALVE_SERVER_TEST_PASS')) {
                throw new GradleException('Valve regression failed; inspect build/valve-test-server/logs/latest.log')
            }
        }
    }
}

if (generatorTest) {
    tasks.named('runServer') {
        doLast {
            if (!file('build/generator-test-server/logs/latest.log').text.contains('DIHYDROGEN_MONOXIDE_ASSEMBLER_SERVER_TEST_PASS')) {
                throw new GradleException('Assembler regression failed; inspect build/generator-test-server/logs/latest.log')
            }
        }
    }
}

if (fireTest) {
    tasks.named('runServer') {
        doLast {
            if (!file('build/fire-test-server/logs/latest.log').text.contains('FINITE_WATER_FIRE_SERVER_TEST_PASS')) {
                throw new GradleException('Fire extinguishing regression failed; inspect build/fire-test-server/logs/latest.log')
            }
        }
    }
}
