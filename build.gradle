plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

base.archivesName = project.archives_base_name
version = project.mod_version
group = project.maven_group
def expandedModVersion = version
def licenseArchiveName = project.archives_base_name
def dripstoneTest = providers.gradleProperty('dripstoneTest').isPresent()
def rainfallTest = providers.gradleProperty('rainfallTest').isPresent()
def rainfallReloadSeed = providers.gradleProperty('rainfallReloadSeed').isPresent()
def cropTest = providers.gradleProperty('cropTest').isPresent()
def sensorTest = providers.gradleProperty('sensorTest').isPresent()
def earlyRulesTest = providers.gradleProperty('earlyRulesTest').isPresent()
def earlyRulesDefaults = providers.gradleProperty('earlyRulesTest').orNull == 'defaults'
def iceTest = providers.gradleProperty('iceTest').isPresent() || earlyRulesTest
def valveTest = providers.gradleProperty('valveTest').isPresent()
def generatorTest = providers.gradleProperty('generatorTest').isPresent()
def pumpTest = providers.gradleProperty('pumpTest').isPresent()
def fireTest = providers.gradleProperty('fireTest').isPresent()
def fluidOptimizationTest = providers.gradleProperty('fluidOptimizationTest').isPresent()
def fluidPerformanceTest = providers.gradleProperty('fluidPerformanceTest').orNull
def pumpPerformanceTest = providers.gradleProperty('pumpPerformanceTest').orNull
if (fluidOptimizationTest) {
    tasks.named('runServer') {
        doLast {
            if (!file('build/fluid-optimization-test-server/logs/latest.log').text.contains('FLUID_OPTIMIZATION_SERVER_TEST_PASS')) {
                throw new GradleException('Fluid optimization regression failed; inspect its server log')
            }
        }
    }
}
if (fluidPerformanceTest != null || pumpPerformanceTest != null) {
    if (!((fluidPerformanceTest ?: pumpPerformanceTest) ==~ /[a-zA-Z0-9-]+/)) throw new GradleException('Invalid performance run name')
    if (providers.gradleProperty('performanceBaseline').isPresent()) {
        sourceSets.main.java.setSrcDirs(['build/performance/baseline-src/src/main/java'])
        sourceSets.main.resources.setSrcDirs(['build/performance/baseline-src/src/main/resources'])
    }
}
if (pumpPerformanceTest != null) {
    sourceSets.main.java.srcDir 'src/pumpPerformanceTest/java'
    tasks.named('runServer') {
        doFirst {
            def props = file("build/performance/pumps/${pumpPerformanceTest}/server.properties")
            props.parentFile.mkdirs()
            def content = props.exists() ? props.text : ''
            props.text = (content =~ /(?m)^max-tick-time=/) ? content.replaceAll(/(?m)^max-tick-time=.*/, 'max-tick-time=-1') : content + '\nmax-tick-time=-1\n'
        }
        doLast {
            if (!file("build/performance/pumps/${pumpPerformanceTest}/logs/latest.log").text.contains('PUMP_PERFORMANCE_SERVER_TEST_PASS')) {
                throw new GradleException('Pump performance fixture failed; inspect its server log')
            }
        }
    }
}
def shaderTest = providers.gradleProperty('shaderTest').orNull
if (dripstoneTest || rainfallTest || rainfallReloadSeed || cropTest || sensorTest || iceTest || pumpTest || valveTest || generatorTest || fireTest || fluidOptimizationTest) {
	sourceSets.main.java.srcDir 'src/serverTest/java'
}

repositories {
	maven { url = 'https://api.modrinth.com/maven' }
	exclusiveContent {
		forRepository {
			maven {
				name = 'CurseForge'
				url = 'https://www.cursemaven.com'
			}
		}
		filter {
			includeGroup 'curse.maven'
		}
	}
}

loom {
    splitEnvironmentSourceSets()
    if (fluidPerformanceTest != null) sourceSets.client.java.srcDir 'src/performanceTest/java'
	if (shaderTest != null) {
		sourceSets.client.java.srcDir 'src/shaderTest/java'
		sourceSets.client.resources.srcDir 'src/shaderTest/resources'
	}

	runs {
        server { runDir 'run26.3' }
        if (dripstoneTest || rainfallTest || rainfallReloadSeed || cropTest || sensorTest || iceTest || pumpTest || valveTest || generatorTest || fireTest || fluidOptimizationTest || pumpPerformanceTest != null) {
			server {
                if (pumpPerformanceTest != null) vmArg "-Dpumpedupwater.pumpSpacing=${providers.gradleProperty('pumpSpacing').getOrElse('5')}"
				if (fluidOptimizationTest) {
					vmArg "-Djava.io.tmpdir=${file('build/fluid-optimization-test-server').absolutePath}"
					vmArg "-XX:FlightRecorderOptions=repository=${file('build/fluid-optimization-test-server').absolutePath}"
				}
				if (earlyRulesTest) vmArg "-Dpumpedupwater.testDefaultRules=${earlyRulesDefaults}"
            if (rainfallReloadSeed) vmArg '-Dpumpedupwater.rainfallReloadSeed=true'
                runDir pumpPerformanceTest != null ? "build/performance/pumps/${pumpPerformanceTest}" : fluidOptimizationTest ? 'build/fluid-optimization-test-server' : earlyRulesTest ? 'build/early-rules-test-server' : fireTest ? 'build/fire-test-server' : generatorTest ? 'build/generator-test-server' : valveTest ? 'build/valve-test-server' : pumpTest ? 'build/pump-test-server' : iceTest ? 'build/ice-test-server' : sensorTest ? 'build/sensor-test-server' : cropTest ? 'build/crop-test-server' : (rainfallTest || rainfallReloadSeed) ? 'build/rainfall-test-server' : 'build/dripstone-test-server'
			}
		}
        client {
            ideConfigGenerated false
            runDir 'run26.3'
            if (fluidPerformanceTest != null) {
                runDir "build/performance/runs/${fluidPerformanceTest}"
                vmArg "-Dpumpedupwater.performanceRun=${fluidPerformanceTest}"
                vmArg "-Dpumpedupwater.performanceAllocations=${providers.gradleProperty('performanceAllocations').isPresent()}"
                vmArg "-Dpumpedupwater.performanceClear=${providers.gradleProperty('performanceClear').isPresent()}"
            }
			if (shaderTest != null) runDir "build/shader-test-client/${shaderTest}"
			if (shaderTest != null && !(shaderTest in ['vanilla', 'sodium', 'iris'])) vmArg '-Dpumpedupwater.shaderProbePack=true'
			if (shaderTest != null && (shaderTest.startsWith('complementary') || shaderTest.startsWith('euphoria')))
				vmArg '-Dpumpedupwater.shaderProbeIntegrated=true'
			if (shaderTest in ['bsl', 'bliss']) vmArg '-Dpumpedupwater.shaderProbeLabPbr=true'
			if (shaderTest == 'complementary-static') vmArg '-Dpumpedupwater.shaderProbeNoEntityShadows=true'
		}
	}

	mods {
		"pumpedupwater" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "com.electronwill.night-config:toml:3.8.3"
	include "com.electronwill.night-config:toml:3.8.3"
	include "com.electronwill.night-config:core:3.8.3"
	// Optional client integration: never bundle Iris/Sodium or require them on servers.
	clientCompileOnly('maven.modrinth:iris:bAdKrpw8') { transitive = false }
	clientCompileOnly('maven.modrinth:sodium:bAZQdGpg') { transitive = false }

	//modImplementation "carpet:fabric-carpet:${project.minecraft_version}-${project.carpet_core_version}"
}

processResources {
    inputs.property 'fluidPerformanceTest', fluidPerformanceTest ?: ''
    inputs.property 'pumpPerformanceTest', pumpPerformanceTest ?: ''
	inputs.property "version", expandedModVersion
	inputs.property "dripstoneTest", dripstoneTest
	inputs.property "rainfallTest", rainfallTest
	inputs.property "rainfallReloadSeed", rainfallReloadSeed
	inputs.property "cropTest", cropTest
	inputs.property "sensorTest", sensorTest
	inputs.property "iceTest", iceTest
	inputs.property "earlyRulesTest", earlyRulesTest
	inputs.property "pumpTest", pumpTest
	inputs.property "valveTest", valveTest
	inputs.property "generatorTest", generatorTest
	inputs.property "fireTest", fireTest
	inputs.property "fluidOptimizationTest", fluidOptimizationTest
	inputs.property 'shaderTest', shaderTest ?: ''

	filesMatching("fabric.mod.json") {
		expand "version": expandedModVersion
        if (pumpPerformanceTest != null) {
            filter { line -> line.replace('"dervogel101.de.pumpedupwater.WaterPhysics"', '"dervogel101.de.pumpedupwater.WaterPhysics", "dervogel101.de.pumpedupwater.features.PumpPerformanceServerTest"') }
        }
        if (fluidPerformanceTest != null) {
            filter { line -> line.replace('"dervogel101.de.pumpedupwater.WaterPhysicsClient"',
                    '"dervogel101.de.pumpedupwater.WaterPhysicsClient", "dervogel101.de.pumpedupwater.FluidPerformanceClient"') }
        }
		if (fluidOptimizationTest) {
			filter { line -> line.replace('"dervogel101.de.pumpedupwater.WaterPhysics"', '"dervogel101.de.pumpedupwater.WaterPhysics", "dervogel101.de.pumpedupwater.features.FluidOptimizationServerTest"') }
		}
		if (shaderTest != null) {
			filter { line -> line.replace('"mixins": [', '"mixins": [ { "config": "pumpedupwater.shadow-test.mixins.json", "environment": "client" },') }
			filter { line -> line.replace('"dervogel101.de.pumpedupwater.WaterPhysicsClient"',
				'"dervogel101.de.pumpedupwater.WaterPhysicsClient", "dervogel101.de.pumpedupwater.ShaderClientProbe"') }
		}
        if (valveTest) {
            filter { line -> line.replace('"dervogel101.de.pumpedupwater.WaterPhysics"',
                    '"dervogel101.de.pumpedupwater.WaterPhysics", "dervogel101.de.pumpedupwater.features.WaterValveServerTest"') }
        }
		if (generatorTest) {
			filter { line -> line.replace('"dervogel101.de.pumpedupwater.WaterPhysics"',
					'"dervogel101.de.pumpedupwater.WaterPhysics", "dervogel101.de.pumpedupwater.features.DihydrogenMonoxideAssemblerServerTest"') }
		}
		if (fireTest) {
			filter { line -> line.replace('"dervogel101.de.pumpedupwater.WaterPhysics"',
					'"dervogel101.de.pumpedupwater.WaterPhysics", "dervogel101.de.pumpedupwater.features.FiniteWaterFireServerTest"') }
		}
		if (pumpTest) {
			filter { line -> line.replace('"dervogel101.de.pumpedupwater.WaterPhysics"',
					'"dervogel101.de.pumpedupwater.WaterPhysics", "dervogel101.de.pumpedupwater.features.WaterPumpServerTest"') }
		}
		if (iceTest) {
			filter { line -> line.replace('"dervogel101.de.pumpedupwater.WaterPhysics"',
					earlyRulesTest ? '"dervogel101.de.pumpedupwater.WaterPhysics", "dervogel101.de.pumpedupwater.EarlyWaterloggingRulesServerTest"' : '"dervogel101.de.pumpedupwater.WaterPhysics", "dervogel101.de.pumpedupwater.features.FiniteIceServerTest"') }
		}
		if (dripstoneTest) {
			filter { line -> line.replace('"dervogel101.de.pumpedupwater.WaterPhysics"',
					'"dervogel101.de.pumpedupwater.WaterPhysics", "dervogel101.de.pumpedupwater.features.DripstoneServerTest"') }
		}
		if (rainfallTest || rainfallReloadSeed) {
			filter { line -> line.replace('"dervogel101.de.pumpedupwater.WaterPhysics"',
					'"dervogel101.de.pumpedupwater.WaterPhysics", "dervogel101.de.pumpedupwater.features.RainfallServerTest"') }
		}
		if (cropTest) {
			filter { line -> line.replace('"dervogel101.de.pumpedupwater.WaterPhysics"',
					'"dervogel101.de.pumpedupwater.WaterPhysics", "dervogel101.de.pumpedupwater.features.CropFertilizationServerTest"') }
		}
		if (sensorTest) {
			filter { line -> line.replace('"dervogel101.de.pumpedupwater.WaterPhysics"',
					'"dervogel101.de.pumpedupwater.WaterPhysics", "dervogel101.de.pumpedupwater.features.RainSensorServerTest"') }
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

tasks.register("physicsSelfTest", JavaExec) {
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "dervogel101.de.pumpedupwater.features.FiniteWaterMathSelfTest"
	// Keep the regression recording out of Windows' potentially inaccessible system temp directory.
	systemProperty 'java.io.tmpdir', temporaryDir.absolutePath
	jvmArgs "-XX:FlightRecorderOptions=repository=${temporaryDir.absolutePath}"
	doFirst { temporaryDir.mkdirs() }
}

test {
	failOnNoDiscoveredTests = false
}

sourceSets {
	clientTest {
		compileClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.compileClasspath
		runtimeClasspath += sourceSets.main.output + sourceSets.client.runtimeClasspath
	}
}

tasks.register('iceRenderSelfTest', JavaExec) {
	dependsOn clientTestClasses
	classpath = sourceSets.clientTest.runtimeClasspath
	mainClass = 'dervogel101.de.pumpedupwater.IceRenderSelfTest'
}

check.dependsOn physicsSelfTest, iceRenderSelfTest

tasks.register('earlyRulesSelfTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dervogel101.de.pumpedupwater.EarlyWaterloggingRulesSelfTest'
    systemProperty 'java.io.tmpdir', temporaryDir.absolutePath
    doFirst { temporaryDir.mkdirs() }
}
check.dependsOn earlyRulesSelfTest

if (earlyRulesTest) {
    tasks.named('runServer') {
        doFirst {
            def run = file('build/early-rules-test-server')
            new File(run, 'config/pumpedupwater').mkdirs()
            new File(run, 'eula.txt').text = 'eula=true\n'
            new File(run, 'server.properties').text = 'online-mode=false\nserver-ip=127.0.0.1\nserver-port=0\nview-distance=2\nsimulation-distance=2\n'
            def rules = new File(run, 'config/pumpedupwater/waterlogging.toml')
            if (earlyRulesDefaults) {
                if (rules.exists() && !rules.delete()) throw new GradleException('Cannot reset isolated rules fixture')
            } else {
                rules.text = '''excluded_blocks = ['minecraft:barrier', 'minecraft:beacon', '#minecraft:leaves', '#minecraft:shulker_boxes', '#minecraft:walls', '#c:glass_panes', '#minecraft:wooden_slabs', 'minecraft:*_stairs', '@pumpedupwater']
included_blocks = ['minecraft:oak_slab', '#minecraft:wooden_stairs', 'pumpedupwater:*', 'minecraft:oak_leaves', 'minecraft:cobblestone_wall', 'minecraft:glass_pane', 'minecraft:barrier', 'minecraft:beacon', 'minecraft:shulker_box']
debug = true
debug_state_threshold = 6480
'''
            }
        }
        doLast {
            def log = file('build/early-rules-test-server/logs/latest.log').text
            if (!log.contains('EARLY_WATERLOGGING_SERVER_TEST_PASS')) {
                throw new GradleException('Early waterlogging state test failed')
            }
            if (earlyRulesDefaults ? log.contains('Waterlogging state debug:') :
                    (!log.contains('Waterlogging state debug: minecraft:cobblestone_wall has 26244 states')
                            || log.contains('Waterlogging state debug: minecraft:oak_stairs '))) {
                throw new GradleException('Startup debug logging ignored enable flag or strict threshold')
            }
        }
    }
}

tasks.register('shaderSelfTest', JavaExec) {
	dependsOn clientTestClasses
	classpath = sourceSets.clientTest.runtimeClasspath + sourceSets.client.compileClasspath
	mainClass = 'dervogel101.de.pumpedupwater.ShaderSelfTest'
	if (providers.gradleProperty('shaderPack').isPresent()) args providers.gradleProperty('shaderPack').get()
}
check.dependsOn shaderSelfTest

tasks.register('pumpGeometrySelfTest', JavaExec) {
	dependsOn clientTestClasses
	classpath = sourceSets.clientTest.runtimeClasspath
	mainClass = 'dervogel101.de.pumpedupwater.PumpGeometrySelfTest'
}
check.dependsOn pumpGeometrySelfTest

if (pumpTest) {
	tasks.named('runServer') {
		doLast {
			if (!file('build/pump-test-server/logs/latest.log').text.contains('WATER_PUMP_SERVER_TEST_PASS')) {
				throw new GradleException('Pump regression failed; inspect build/pump-test-server/logs/latest.log')
			}
		}
	}
}

if (iceTest && !earlyRulesTest) {
	tasks.named('runServer') {
		doLast {
			if (!file('build/ice-test-server/logs/latest.log').text.contains('FINITE_ICE_SERVER_TEST_PASS')) {
				throw new GradleException('Finite ice regression failed; inspect build/ice-test-server/logs/latest.log')
			}
		}
	}
}

if (sensorTest) {
	tasks.named('runServer') {
		doLast {
			if (!file('build/sensor-test-server/logs/latest.log').text.contains('RAIN_SENSOR_SERVER_TEST_PASS')) {
				throw new GradleException('Sensor/grate regression failed; inspect build/sensor-test-server/logs/latest.log')
			}
		}
	}
}

if (cropTest) {
	tasks.named('runServer') {
		doLast {
			if (!file('build/crop-test-server/logs/latest.log').text.contains('CROP_FERTILIZATION_SERVER_TEST_PASS')) {
				throw new GradleException('Crop fertilization regression failed; inspect build/crop-test-server/logs/latest.log')
			}
		}
	}
}

if (dripstoneTest) {
	tasks.named('runServer') {
		doLast {
			if (!file('build/dripstone-test-server/logs/latest.log').text.contains('DRIPSTONE_SERVER_TEST_PASS')) {
				throw new GradleException('Dripstone server regression failed; inspect build/dripstone-test-server/logs/latest.log')
			}
		}
	}
}

if (rainfallTest || rainfallReloadSeed) {
	tasks.named('runServer') {
		doFirst {
			def run = file('build/rainfall-test-server')
			run.mkdirs()
			new File(run, 'eula.txt').text = 'eula=true\n'
			new File(run, 'server.properties').text = 'online-mode=false\nserver-ip=127.0.0.1\nserver-port=0\nview-distance=2\nsimulation-distance=2\n'
		}
		doLast {
			def log = file('build/rainfall-test-server/logs/latest.log').text
			if (rainfallTest && !log.contains('RAINFALL_SERVER_TEST_PASS')) {
				throw new GradleException('Rainfall regression failed; inspect build/rainfall-test-server/logs/latest.log')
			}
			if (rainfallReloadSeed && !log.contains('RAINFALL_RELOAD_SEED_PASS')) {
				throw new GradleException('Rainfall reload seed failed; inspect build/rainfall-test-server/logs/latest.log')
			}
		}
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${licenseArchiveName}"}
	}
	from("NOTICE.md")
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

tasks.register('valveGeometrySelfTest', JavaExec) {
    dependsOn clientTestClasses
    classpath = sourceSets.clientTest.runtimeClasspath
    mainClass = 'dervogel101.de.pumpedupwater.ValveGeometrySelfTest'
}
check.dependsOn valveGeometrySelfTest

if (valveTest) {
    tasks.named('runServer') {
        doLast {
            if (!file('build/valve-test-server/logs/latest.log').text.contains('WATER_VALVE_SERVER_TEST_PASS')) {
                throw new GradleException('Valve regression failed; inspect build/valve-test-server/logs/latest.log')
            }
        }
    }
}

if (generatorTest) {
    tasks.named('runServer') {
        doLast {
            if (!file('build/generator-test-server/logs/latest.log').text.contains('DIHYDROGEN_MONOXIDE_ASSEMBLER_SERVER_TEST_PASS')) {
                throw new GradleException('Assembler regression failed; inspect build/generator-test-server/logs/latest.log')
            }
        }
    }
}

if (fireTest) {
    tasks.named('runServer') {
        doLast {
            if (!file('build/fire-test-server/logs/latest.log').text.contains('FINITE_WATER_FIRE_SERVER_TEST_PASS')) {
                throw new GradleException('Fire extinguishing regression failed; inspect build/fire-test-server/logs/latest.log')
            }
        }
    }
}

tasks.register('machineryMeshSelfTest', JavaExec) {
    dependsOn clientTestClasses
    classpath = sourceSets.clientTest.runtimeClasspath
    mainClass = 'dervogel101.de.pumpedupwater.MachineryMeshSelfTest'
}
check.dependsOn machineryMeshSelfTest
